name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-jammy
    env:
      BASEURL: ${{ vars.BASEURL || 'https://hubstaff.com/' }}
      MAILSURPAPIKEY: ${{ secrets.MAILSURPAPIKEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Verify MailSlurp secret
        run: |
          if [ -z "$MAILSURPAPIKEY" ]; then
            echo "::error::MAILSURPAPIKEY secret is not set."
            echo "Go to Settings → Secrets and variables → Actions → New repository secret"
            echo "Name: MAILSURPAPIKEY  Value: your key from https://www.mailslurp.com/"
            exit 1
          fi
          echo "MAILSURPAPIKEY is configured."

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload JUnit report for QA Results Hub
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: junit-results
          path: reports/junit.xml
          retention-days: 30

      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
